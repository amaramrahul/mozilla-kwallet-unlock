// kwallet-unlock: fill in the Firefox/Thunderbird primary password from KWallet.
// (Firefox and Thunderbird skip the first line of this file; keep it a comment.)
//
// The same file is used for both applications, so keep it app-neutral: the
// application's name is read at runtime.
//
// Uses the KWallet entry Passwords -> "<App> Primary Password", e.g.
// "Firefox Primary Password" or "Thunderbird Primary Password".
// - Whenever the application shows its primary password prompt (at startup,
//   or when viewing or copying saved passwords), the password is read from
//   KWallet, filled in and accepted automatically.
// - Just before the first window opens, the password store is also unlocked
//   directly if the application still offers the older token interface
//   (Thunderbird 140 does; current Firefox does not, so there the prompt is
//   filled instead).
// If the wallet is locked, kwalletd isn't running, the entry is missing or
// KWallet doesn't answer within TIMEOUT_MS, nothing is done and the
// application prompts as usual. It never asks KWallet to unlock the wallet.

(function () {
  const Cc = Components.classes;
  const Ci = Components.interfaces;

  // "Firefox" or "Thunderbird". Also the name shown in KWallet's access list.
  const APP_ID = Cc["@mozilla.org/xre/app-info;1"].getService(Ci.nsIXULAppInfo).name;
  const FOLDER = "Passwords";
  const KEY = APP_ID + " Primary Password";
  const TIMEOUT_MS = 2000;

  const KWALLET_SERVICES = [
    ["org.kde.kwalletd6", "/modules/kwalletd6"], // Plasma 6
    ["org.kde.kwalletd5", "/modules/kwalletd5"], // Plasma 5 fallback
  ];

  const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);

  function log(msg) {
    try {
      Cc["@mozilla.org/consoleservice;1"]
        .getService(Ci.nsIConsoleService)
        .logStringMessage("kwallet-unlock: " + msg);
    } catch (e) {}
  }

  // The password store ("token"), or null if it can't be reached directly.
  // The prompt can still be filled without it.
  function getToken() {
    try {
      const token = Cc["@mozilla.org/security/internalkeytoken;1"]?.getService(Ci.nsIPK11Token);
      if (token && typeof token.isLoggedIn === "function") {
        return token;
      }
    } catch (e) {}
    try {
      const db = Cc["@mozilla.org/security/pk11tokendb;1"];
      if (db) {
        return db.getService(Ci.nsIPK11TokenDB).getInternalKeyToken();
      }
    } catch (e) {}
    return null;
  }

  async function busctl(Subprocess, args) {
    const proc = await Subprocess.call({
      command: "/usr/bin/busctl",
      arguments: ["--user", "--json=short", "--auto-start=no", ...args],
      stderr: "stdout",
    });
    let out = "";
    let chunk;
    while ((chunk = await proc.stdout.readString())) {
      out += chunk;
    }
    const { exitCode } = await proc.wait();
    if (exitCode !== 0) {
      throw new Error(out.trim() || "busctl exited with " + exitCode);
    }
    return JSON.parse(out).data[0];
  }

  async function getPasswordFromWallet() {
    const { Subprocess } = ChromeUtils.importESModule(
      "resource://gre/modules/Subprocess.sys.mjs"
    );
    for (const [service, path] of KWALLET_SERVICES) {
      const call = (...a) =>
        busctl(Subprocess, ["call", service, path, "org.kde.KWallet", ...a]);

      let wallet;
      try {
        wallet = await call("networkWallet");
      } catch (e) {
        continue; // this kwalletd isn't running
      }

      if (!(await call("isOpen", "s", wallet))) {
        log('wallet "' + wallet + '" is locked; leaving it to the prompt');
        return null;
      }

      // Wallet is already open, so this only registers our app handle.
      const handle = await call("open", "sxs", wallet, "0", APP_ID);
      if (handle < 0) {
        return null;
      }
      const pw = await call("readPassword", "isss", String(handle), FOLDER, KEY, APP_ID);
      if (!pw) {
        log('no entry "' + FOLDER + "/" + KEY + '" in wallet "' + wallet + '"');
        return null;
      }
      return pw;
    }
    log("kwalletd is not running");
    return null;
  }

  // Ask KWallet each time, so a wallet locked (or opened) later in the session
  // is respected. Callers that overlap share the same lookup.
  let passwordPromise = null;
  function walletPassword() {
    if (!passwordPromise) {
      passwordPromise = getPasswordFromWallet()
        .catch(e => {
          log("error reading KWallet: " + e.message);
          return null;
        })
        .finally(() => {
          passwordPromise = null;
        });
    }
    return passwordPromise;
  }

  // ---- Filling in the primary password prompt ----

  // If a prompt reappears soon after a fill, the stored password was
  // probably rejected; stop filling for the rest of the session.
  const RETRY_WINDOW_MS = 5000;
  let lastFillTime = 0;
  let autofillDisabled = false;

  function isShown(el) {
    return !!el && !el.closest("[hidden]");
  }

  function isPrimaryPasswordDialog(win) {
    const doc = win.document;
    if (!isShown(doc.getElementById("password1Container")) ||
        isShown(doc.getElementById("loginContainer"))) {
      return false; // not a password-only prompt
    }
    const token = getToken();
    if (token && (!token.hasPassword || token.isLoggedIn())) {
      return false;
    }
    const text = (doc.getElementById("infoBody")?.textContent || "").trim();
    return /(primary|master) password/i.test(text);
  }

  async function onDialogLoaded(win) {
    if (autofillDisabled || !isPrimaryPasswordDialog(win)) {
      return;
    }
    if (lastFillTime && Date.now() - lastFillTime < RETRY_WINDOW_MS) {
      autofillDisabled = true;
      log("prompt reappeared right after filling; stored password may be wrong, not filling again");
      return;
    }
    const pw = await walletPassword();
    if (!pw || win.closed) {
      return; // leave the prompt for the user
    }
    const doc = win.document;
    lastFillTime = Date.now();
    doc.getElementById("password1Textbox").value = pw;
    const dialog = doc.getElementById("commonDialog") || doc.querySelector("dialog");
    if (dialog && typeof dialog.acceptDialog === "function") {
      dialog.acceptDialog();
    } else {
      dialog?.getButton?.("accept")?.click();
    }
    log("filled primary password prompt from KWallet");
  }

  const dialogObserver = {
    observe(subject) {
      try {
        if (subject?.document?.documentURI?.startsWith("chrome://global/content/commonDialog")) {
          onDialogLoaded(subject).catch(e => log("error: " + e.message));
        }
      } catch (e) {
        log("error: " + e.message);
      }
    },
  };

  // ---- Unlocking directly just before the first window opens ----

  function unlockNow() {
    const token = getToken();
    if (!token || !token.hasPassword || token.isLoggedIn()) {
      return; // can't reach the store, no password set, or already unlocked
    }

    // Wait here (startup is paused) until KWallet answers or we time out.
    let done = false;
    let timedOut = false;
    let pw = null;
    walletPassword().then(result => { pw = result; done = true; });
    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback(() => { timedOut = true; }, TIMEOUT_MS, Ci.nsITimer.TYPE_ONE_SHOT);
    Cc["@mozilla.org/thread-manager;1"]
      .getService(Ci.nsIThreadManager)
      .spinEventLoopUntil("kwallet-unlock autoconfig", () => done || timedOut);
    timer.cancel();

    if (!done) {
      log("KWallet did not answer in time; leaving it to the prompt");
      return;
    }
    if (!pw || token.isLoggedIn()) {
      return;
    }
    if (token.checkPassword(pw)) {
      log("primary password unlocked from KWallet");
    } else {
      log("password stored in KWallet is incorrect");
    }
  }

  const startupObserver = {
    observe() {
      obs.removeObserver(startupObserver, "final-ui-startup");
      try {
        unlockNow();
      } catch (e) {
        log("error: " + e.message);
      }
    },
  };

  try {
    obs.addObserver(dialogObserver, "common-dialog-loaded");
    obs.addObserver(startupObserver, "final-ui-startup");
  } catch (e) {
    log("could not set up: " + e.message);
  }
})();
